# DXVK Configuration Optimized for PanVK on ARM Mali-G720 MC8 (CSF Architecture)
# Place this file in the game directory or in the system32/syswow64 / container drive_c of Winlator

# --- Fix Black Screen & Frame Presentation ---
dxvk.tearFree = True
dxvk.syncInterval = 0
d3d11.relaxedBarriers = True
dxvk.hud = devinfo,fps

# --- Mali Valhall / CSF Memory & Texture Compatibility ---
# Mali GPUs do not support native BCn desktop decompression without emulation.
# Relaxed memory barriers prevent pipeline stalls and black frames during render pass transitions.
dxvk.useRawSsbo = True
d3d11.constantBufferRangeCheck = True

# --- Async Shader Compilation ---
dxvk.enableAsync = True
dxvk.gpl = False

# --- Sampler & Render Target Tweaks ---
d3d11.maxTessFactor = 8
d3d11.samplerAnisotropy = 1
